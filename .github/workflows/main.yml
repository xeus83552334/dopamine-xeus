name: Build Dopamine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-13

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'

    - name: Build project
      run: |
        echo "Starting build process..."
        make package
        # Або інша команда збірки, залежно від структури вашого Makefile

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Dopamine-ipa
        path: |
          *.ipa
          packages/*.ipa
